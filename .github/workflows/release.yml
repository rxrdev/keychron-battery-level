name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          MARKETING="$(sh scripts/version-from-tag.sh "$VERSION")"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MARKETING=$MARKETING" >> $GITHUB_OUTPUT
      
      - name: Run BatteryKit tests
        run: swift test --package-path BatteryKit
      
      - name: Build app
        run: |
          xcodebuild -project KeychronBattery.xcodeproj \
                     -scheme KeychronBattery \
                     -configuration Release \
                     -derivedDataPath ./build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=YES \
                     CODE_SIGNING_ALLOWED=YES \
                     MARKETING_VERSION=${{ steps.get_version.outputs.MARKETING }} \
                     CURRENT_PROJECT_VERSION=${{ github.run_number }}
      
      - name: Verify app bundle
        run: |
          ls -lh build/Build/Products/Release/KeychronBattery.app/Contents/MacOS/
          file build/Build/Products/Release/KeychronBattery.app/Contents/MacOS/KeychronBattery
          du -sh build/Build/Products/Release/KeychronBattery.app
          
          APP=build/Build/Products/Release/KeychronBattery.app
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          if [ "$BUILT" != "${{ steps.get_version.outputs.MARKETING }}" ]; then
            echo "error: app version $BUILT does not match tag ${{ steps.get_version.outputs.VERSION }}"
            exit 1
          fi
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q get-task-allow; then
            echo "error: Release build carries com.apple.security.get-task-allow"
            exit 1
          fi
      
      - name: Install create-dmg
        run: brew install create-dmg
      
      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R build/Build/Products/Release/KeychronBattery.app dmg-staging/
          
          create-dmg \
            --volname "KeychronBattery" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "KeychronBattery.app" 175 120 \
            --hide-extension "KeychronBattery.app" \
            --app-drop-link 625 120 \
            "KeychronBattery-${{ steps.get_version.outputs.VERSION }}.dmg" \
            "dmg-staging/" || true
          
          # create-dmg sometimes returns non-zero even on success
          if [ ! -f "KeychronBattery-${{ steps.get_version.outputs.VERSION }}.dmg" ]; then
            # Fallback to hdiutil if create-dmg fails
            hdiutil create -volname "Keychron Battery Monitor" \
                           -srcfolder dmg-staging \
                           -ov -format UDZO \
                           "KeychronBattery-${{ steps.get_version.outputs.VERSION }}.dmg"
          fi
      
      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Keychron Battery Level Monitor ${{ steps.get_version.outputs.VERSION }}
          
          ### Installation
          1. Download `KeychronBattery-${{ steps.get_version.outputs.VERSION }}.dmg`
          2. Open the DMG file
          3. Drag the app to your Applications folder
          4. Launch and grant Bluetooth permissions
          
          ### Requirements
          - macOS 15.0 or later
          - A Keychron keyboard, or any Bluetooth device that reports its battery
          
          ### Features
          - 🔋 Real-time battery monitoring in menu bar
          - 🎧 Headsets and other Bluetooth Classic devices
          - 🎨 Color-coded battery level display
          - 🔄 Auto-refresh every 5 minutes
          - 🚀 Launch at login option
          EOF
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: KeychronBattery-${{ steps.get_version.outputs.VERSION }}.dmg
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Clean up
        run: rm -rf dmg-staging build
